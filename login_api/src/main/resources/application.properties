spring.application.name=login_api

# ─── PERFIL ACTIVO ────────────────────────────────────────────────────
spring.profiles.active=dev

# ═══════════════════════════════════════════════════════════════════════
# PERFIL DEV (local)
# ═══════════════════════════════════════════════════════════════════════

# ─── DATASOURCE ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/login_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / HIBERNATE ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ──────────────────────────────────────────────────────────────
jwt.secret=MiClaveSecretaSuperLargaParaJWTQueDeberiaSerDe256BitsOmas!!
jwt.expiration=86400000

# ─── SERVIDOR ─────────────────────────────────────────────────────────
server.port=8080

# ─── SWAGGER ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
